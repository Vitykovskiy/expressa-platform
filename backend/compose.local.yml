services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: expressa
      POSTGRES_USER: expressa
      POSTGRES_PASSWORD: expressa
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expressa -d expressa"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
