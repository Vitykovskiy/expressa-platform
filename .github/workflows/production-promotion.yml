name: Production promotion

on:
  workflow_dispatch:
    inputs:
      staging_tag:
        description: Accepted staging-v* tag to promote
        required: true
        type: string
      confirm_production:
        description: Confirm production promotion
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  guard:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      inputs.confirm_production == true
    runs-on: ubuntu-24.04
    steps:
      - name: Record guarded production dispatch
        run: echo "production dispatch guard passed"
  promote:
    needs: guard
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.staging_tag }}
          fetch-depth: 0
      - name: Verify accepted immutable staging manifest
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_TAG: ${{ inputs.staging_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$STAGING_TAG" =~ ^staging-v[0-9]+(\.[0-9]+)*$ ]]
          tag_commit="$(git rev-parse --verify "refs/tags/$STAGING_TAG^{commit}")"
          [[ "$tag_commit" == "$(git rev-parse HEAD)" ]]
          export TAG_COMMIT="$tag_commit"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow staging-deploy.yml --status success --limit 100 --json headBranch,headSha,conclusion --jq 'map(select(.headBranch == env.STAGING_TAG and .headSha == env.TAG_COMMIT and .conclusion == "success")) | length > 0' | grep -qx true
          declare -A expected=( [BACKEND_IMAGE]=backend [FRONT_IMAGE]=front-office [BACK_IMAGE]=back-office ) seen=()
          while IFS='=' read -r key value; do
            [[ -n "$key" && -n "$value" && -z "${seen[$key]:-}" && "${expected[$key]:-}" ]] || exit 1
            [[ "$value" =~ ^127\.0\.0\.1:5000/expressa/${expected[$key]}@sha256:[a-f0-9]{64}$ ]] || exit 1
            seen[$key]=1
          done < deploy/staging.env
          [[ "${#seen[@]}" == 3 ]]
      - name: Promote accepted image set
        env:
          DEPLOY_HOST: ${{ secrets.EXPRESSA_VPS_HOST }}
          DEPLOY_PORT: ${{ secrets.EXPRESSA_VPS_PORT }}
          DEPLOY_USER: ${{ secrets.EXPRESSA_VPS_DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.EXPRESSA_VPS_DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.EXPRESSA_VPS_KNOWN_HOSTS }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.EXPRESSA_BACKUP_ENCRYPTION_KEY }}
          BACKUP_INTEGRITY_KEY: ${{ secrets.EXPRESSA_BACKUP_INTEGRITY_KEY }}
        run: deploy/run-remote.sh production deploy/staging.env
