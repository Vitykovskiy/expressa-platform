name: Delivery static checks

on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'backend/docs/**'
      - 'backend/**/README.md'
      - 'backend/**/AGENTS.md'
      - 'front-office/docs/**'
      - 'front-office/**/README.md'
      - 'front-office/**/AGENTS.md'
      - 'back-office/docs/**'
      - 'back-office/**/README.md'
      - 'back-office/**/AGENTS.md'
      - 'scripts/**'
      - 'e2e/Dockerfile'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Check documentation
        run: node scripts/check-docs.mjs
      - run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          bash -n deploy/deploy.sh deploy/run-remote.sh deploy/run-e2e-remote.sh
          shellcheck -e SC1090,SC2029 deploy/deploy.sh deploy/run-remote.sh deploy/run-e2e-remote.sh
          bash deploy/run-e2e-remote.sh self-test-allowlist
          node --check deploy/smoke-staging.mjs deploy/smoke-production.mjs
          DEPLOY_ENV=development NODE_ENV=development COMPOSE_PROJECT_NAME=expressa-development POSTGRES_DB=expressa POSTGRES_USER=expressa POSTGRES_PASSWORD=example-password DATABASE_URL=postgresql://expressa:example-password@localhost:5432/expressa AUTH_ACCESS_TOKEN_SECRET=example-access-token-secret AUTH_OTP_PEPPER=example-otp-pepper AUTH_DEVELOPMENT_OTP=123456 DELIVERY_VAPID_SUBJECT=mailto:push@expressa.test DELIVERY_VAPID_PUBLIC_KEY=BOT-VsrivTqPsMDCzS45APlNSMbgcTT5jqlrYu2-6PCRGB0YneXQDNsbrIxTAy0jJ-kUlKlWPm94PeirK8A8wCw DELIVERY_VAPID_PRIVATE_KEY=9rZGGVplNbc2psiiiyOla_ZL-qDyrgIZqD_cpLz1G0c VAPID_SUBJECT=mailto:push@expressa.test VAPID_PUBLIC_KEY=BOT-VsrivTqPsMDCzS45APlNSMbgcTT5jqlrYu2-6PCRGB0YneXQDNsbrIxTAy0jJ-kUlKlWPm94PeirK8A8wCw VAPID_PRIVATE_KEY=9rZGGVplNbc2psiiiyOla_ZL-qDyrgIZqD_cpLz1G0c CORS_ORIGINS=https://development.example BACKEND_IMAGE=127.0.0.1:5000/expressa/backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa FRONT_IMAGE=127.0.0.1:5000/expressa/front-office@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa BACK_IMAGE=127.0.0.1:5000/expressa/back-office@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa docker compose -f deploy/compose.yml config -q
          E2E_REPORT_ALLOWLIST=127.0.0.1/32 E2E_RUN_ID=1 E2E_REVISION=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa E2E_RUN_URL=https://github.com/expressa/expressa/actions/runs/1 E2E_PROFILE=seeded E2E_ADMIN_PHONE=+79990000001 E2E_STAFF_PHONE=+79990000002 E2E_CUSTOMER_PHONE=+79990000003 E2E_CUSTOMER_2_PHONE=+79990000004 E2E_OTP=123456 POSTGRES_PASSWORD=example-password AUTH_ACCESS_TOKEN_SECRET=example-access-token-secret AUTH_OTP_PEPPER=example-otp-pepper VAPID_SUBJECT=mailto:push@expressa.test VAPID_PUBLIC_KEY=BOT-VsrivTqPsMDCzS45APlNSMbgcTT5jqlrYu2-6PCRGB0YneXQDNsbrIxTAy0jJ-kUlKlWPm94PeirK8A8wCw VAPID_PRIVATE_KEY=9rZGGVplNbc2psiiiyOla_ZL-qDyrgIZqD_cpLz1G0c BACKEND_IMAGE=127.0.0.1:5000/expressa/backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa FRONT_IMAGE=127.0.0.1:5000/expressa/front-office@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa BACK_IMAGE=127.0.0.1:5000/expressa/back-office@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa E2E_IMAGE=127.0.0.1:5000/expressa/e2e@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa E2E_ARTIFACT_DIRECTORY=/tmp/e2e-artifacts docker compose -f deploy/e2e-compose.yml config -q
