name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://expressa:expressa@localhost:5432/expressa
      NODE_ENV: local
      PORT: '3000'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: expressa
          POSTGRES_USER: expressa
          POSTGRES_PASSWORD: expressa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expressa -d expressa"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --runInBand

      - name: PostgreSQL integration tests
        run: npm run test:integration

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Production startup test
        run: npm run test:production

      - name: Verify OpenAPI specification
        run: npm run openapi:check

      - name: Build
        run: npm run build

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high

      - name: Validate GHCR image build
        run: docker build --tag ghcr.io/${{ github.repository_owner }}/expressa-backend:ci .
