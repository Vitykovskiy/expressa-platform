name: Staging deployment

on:
  push:
    tags: ['staging-v*']

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  backend:
    uses: ./.github/workflows/backend-ci.yml
  front:
    uses: ./.github/workflows/front-office-ci.yml
  back:
    uses: ./.github/workflows/back-office-ci.yml
  deploy:
    needs: [backend, front, back]
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify immutable staging manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          declare -A expected=( [BACKEND_IMAGE]=backend [FRONT_IMAGE]=front-office [BACK_IMAGE]=back-office ) seen=()
          while IFS='=' read -r key value; do
            [[ -n "$key" && -n "$value" && -z "${seen[$key]:-}" && "${expected[$key]:-}" ]] || exit 1
            [[ "$value" =~ ^127\.0\.0\.1:5000/expressa/${expected[$key]}@sha256:[a-f0-9]{64}$ ]] || exit 1
            seen[$key]=1
          done < deploy/staging.env
          [[ "${#seen[@]}" == 3 ]]
      - name: Deploy tagged image set
        env:
          DEPLOY_HOST: ${{ secrets.EXPRESSA_VPS_HOST }}
          DEPLOY_PORT: ${{ secrets.EXPRESSA_VPS_PORT }}
          DEPLOY_USER: ${{ secrets.EXPRESSA_VPS_DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.EXPRESSA_VPS_DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.EXPRESSA_VPS_KNOWN_HOSTS }}
          BOOTSTRAP_ADMIN_PHONE: ${{ secrets.BOOTSTRAP_ADMIN_PHONE }}
          AUTH_ACCESS_TOKEN_SECRET: ${{ secrets.AUTH_ACCESS_TOKEN_SECRET }}
          AUTH_OTP_PEPPER: ${{ secrets.AUTH_OTP_PEPPER }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.EXPRESSA_BACKUP_ENCRYPTION_KEY }}
          BACKUP_INTEGRITY_KEY: ${{ secrets.EXPRESSA_BACKUP_INTEGRITY_KEY }}
        run: deploy/run-remote.sh staging deploy/staging.env
