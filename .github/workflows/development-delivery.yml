name: Development delivery

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: development-deployment
  cancel-in-progress: false

jobs:
  backend:
    uses: ./.github/workflows/backend-ci.yml
  front:
    uses: ./.github/workflows/front-office-ci.yml
  back:
    uses: ./.github/workflows/back-office-ci.yml
  deploy-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Validate deployment scripts
        run: |
          bash -n deploy/deploy.sh deploy/run-remote.sh
          shellcheck -e SC1090 deploy/deploy.sh
          shellcheck -e SC2029 deploy/run-remote.sh
  deploy:
    needs: [backend, front, back, deploy-static]
    runs-on: ubuntu-24.04
    environment: development
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Build and push immutable images
        env:
          DEPLOY_HOST: ${{ secrets.EXPRESSA_VPS_HOST }}
          DEPLOY_PORT: ${{ secrets.EXPRESSA_VPS_PORT }}
          DEPLOY_USER: ${{ secrets.EXPRESSA_VPS_DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.EXPRESSA_VPS_DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.EXPRESSA_VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          temporary_directory="$(mktemp -d)"
          trap 'rm -rf -- "$temporary_directory"' EXIT
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$temporary_directory/key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$temporary_directory/known_hosts"
          chmod 600 "$temporary_directory/key" "$temporary_directory/known_hosts"
          ssh -i "$temporary_directory/key" -o UserKnownHostsFile="$temporary_directory/known_hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -p "$DEPLOY_PORT" -N -L 5000:127.0.0.1:5000 "$DEPLOY_USER@$DEPLOY_HOST" &
          tunnel_pid=$!
          trap 'kill "$tunnel_pid" 2>/dev/null || true; rm -rf -- "$temporary_directory"' EXIT
          for _ in {1..20}; do curl --silent --fail http://127.0.0.1:5000/v2/ >/dev/null && break; sleep 1; done
          tag="sha-${GITHUB_SHA}"
          docker build --tag "127.0.0.1:5000/expressa/backend:$tag" backend
          docker build --build-arg VITE_APP_ENV=development --build-arg VITE_API_BASE_URL=/ --tag "127.0.0.1:5000/expressa/front-office:$tag" front-office
          docker build --build-arg VITE_APP_ENV=development --build-arg VITE_API_BASE_URL=/ --tag "127.0.0.1:5000/expressa/back-office:$tag" back-office
          docker push "127.0.0.1:5000/expressa/backend:$tag"
          docker push "127.0.0.1:5000/expressa/front-office:$tag"
          docker push "127.0.0.1:5000/expressa/back-office:$tag"
          {
            printf 'BACKEND_IMAGE=%s\n' "$(docker inspect --format '{{index .RepoDigests 0}}' "127.0.0.1:5000/expressa/backend:$tag")"
            printf 'FRONT_IMAGE=%s\n' "$(docker inspect --format '{{index .RepoDigests 0}}' "127.0.0.1:5000/expressa/front-office:$tag")"
            printf 'BACK_IMAGE=%s\n' "$(docker inspect --format '{{index .RepoDigests 0}}' "127.0.0.1:5000/expressa/back-office:$tag")"
          } > "$temporary_directory/images.env"
          cp "$temporary_directory/images.env" deploy/images.env
      - name: Upload deploy image manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deploy-images-${{ github.sha }}
          path: deploy/images.env
          retention-days: 3
      - name: Deploy current checkout
        env:
          DEPLOY_HOST: ${{ secrets.EXPRESSA_VPS_HOST }}
          DEPLOY_PORT: ${{ secrets.EXPRESSA_VPS_PORT }}
          DEPLOY_USER: ${{ secrets.EXPRESSA_VPS_DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.EXPRESSA_VPS_DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.EXPRESSA_VPS_KNOWN_HOSTS }}
          BOOTSTRAP_ADMIN_PHONE: ${{ secrets.BOOTSTRAP_ADMIN_PHONE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: deploy/run-remote.sh development deploy/images.env
