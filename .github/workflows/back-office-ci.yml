name: Back-office CI

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - "back-office/**"
      - "backend/openapi/**"
      - ".github/workflows/back-office-ci.yml"

permissions:
  contents: read

concurrency:
  group: back-office-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify back-office
    runs-on: ubuntu-24.04
    # Playwright v1.62.1 Noble Linux image for GitHub-hosted amd64 runners.
    container: mcr.microsoft.com/playwright@sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac
    defaults:
      run:
        working-directory: back-office
    env:
      VITE_APP_ENV: development
      VITE_API_BASE_URL: https://api.development.example
    steps:
      - name: Checkout
        # actions/checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        # actions/setup-node v5.0.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: back-office/.nvmrc
          cache: npm
          cache-dependency-path: back-office/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --run

      - name: Verify OpenAPI contract
        run: npm run contract:check

      - name: Build Storybook
        run: npm run storybook:build

      - name: Verify Storybook preview
        run: test -f node_modules/.storybook-static/index.html

      - name: Upload Storybook preview
        # actions/upload-artifact v4.6.0
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: back-office-storybook
          path: back-office/node_modules/.storybook-static
          include-hidden-files: true

      - name: Test Storybook interactions
        run: npm run test:storybook

      - name: Test Storybook accessibility
        run: npm run test:a11y

      - name: Test Storybook visual regression
        run: npm run test:visual

      - name: Upload visual baselines
        # actions/upload-artifact v4.6.0
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: back-office-visual-baselines
          path: back-office/tests/e2e/visual.e2e.ts-snapshots

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high

  docker-build:
    name: Validate back-office Docker image
    runs-on: ubuntu-24.04
    env:
      VITE_APP_ENV: development
      VITE_API_BASE_URL: https://api.development.example
    steps:
      - name: Checkout
        # actions/checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Validate Docker image build
        working-directory: back-office
        run: >-
          docker build
          --build-arg VITE_APP_ENV="$VITE_APP_ENV"
          --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL"
          --tag expressa-back-office:ci
          .

  auth-e2e:
    name: Back-office auth E2E
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: back-office/.nvmrc
          cache: npm
          cache-dependency-path: back-office/package-lock.json

      - name: Install back-office dependencies
        working-directory: back-office
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install Chromium
        working-directory: back-office
        run: npx playwright install --with-deps chromium

      - name: Run auth roles E2E
        working-directory: back-office
        run: >-
          VITE_APP_ENV=development VITE_API_BASE_URL=http://127.0.0.1:3000
          npm run build && PLAYWRIGHT_TARGET=auth npx playwright test --project=auth-e2e
