name: Development operations verification

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      confirm_operations_verification:
        description: Run backup, isolated restore and alert delivery verification on development
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: development-operations-verification
  cancel-in-progress: false

jobs:
  guard:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.confirm_operations_verification)) }}
    runs-on: ubuntu-24.04
    outputs:
      main_sha: ${{ steps.main_sha.outputs.value }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false
      - id: main_sha
        name: Verify immutable main revision
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          main_sha="$(git rev-parse HEAD)"
          [[ "$main_sha" =~ ^[a-f0-9]{40}$ && "$GITHUB_SHA" == "$main_sha" ]] || exit 1
          printf 'value=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
  verify:
    needs: guard
    runs-on: ubuntu-24.04
    environment: development
    env:
      VERIFIED_MAIN_SHA: ${{ needs.guard.outputs.main_sha }}
      DEPLOY_HOST: ${{ secrets.EXPRESSA_VPS_HOST }}
      DEPLOY_PORT: ${{ secrets.EXPRESSA_VPS_PORT }}
      DEPLOY_USER: ${{ secrets.EXPRESSA_VPS_DEPLOY_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.EXPRESSA_VPS_DEPLOY_SSH_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.EXPRESSA_VPS_KNOWN_HOSTS }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.EXPRESSA_BACKUP_ENCRYPTION_KEY }}
      BACKUP_INTEGRITY_KEY: ${{ secrets.EXPRESSA_BACKUP_INTEGRITY_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.guard.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify staged source revision
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$VERIFIED_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$VERIFIED_MAIN_SHA" ]]
          git diff --exit-code
      - name: Verify development operations
        shell: bash
        run: |
          set -Eeuo pipefail
          temporary_directory="$(mktemp -d)"
          evidence_file="$RUNNER_TEMP/operations-evidence.txt"
          cleanup() { rm -rf -- "$temporary_directory"; }
          trap cleanup EXIT
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$temporary_directory/key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$temporary_directory/known_hosts"
          chmod 600 "$temporary_directory/key" "$temporary_directory/known_hosts"
          ssh_options=(-i "$temporary_directory/key" -o UserKnownHostsFile="$temporary_directory/known_hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -p "$DEPLOY_PORT")
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          remote_directory="/tmp/expressa-ops-verify-$GITHUB_RUN_ID"
          [[ "$remote_directory" == "/tmp/expressa-ops-verify-$GITHUB_RUN_ID" ]]
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "test ! -e $(printf %q "$remote_directory") && mkdir -m 700 -- $(printf %q "$remote_directory")"
          remote_cleanup() {
            ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "test $(printf %q "$remote_directory") = $(printf %q "/tmp/expressa-ops-verify-$GITHUB_RUN_ID") && rm -rf -- $(printf %q "$remote_directory")" >/dev/null 2>&1 || true
            cleanup
          }
          trap remote_cleanup EXIT
          cat > "$temporary_directory/verify-operations.sh" <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077
          fail() { printf '%s\n' "operations verification: $1" >&2; exit 1; }
          evidence() { printf 'expressa-operations-evidence: check=%s status=passed%s\n' "$1" "${2:+ $2}"; }
          [[ "$VERIFIED_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]] || fail 'verified main revision is unavailable'
          [[ "$STAGED_DEPLOY_DIRECTORY" == "/tmp/expressa-ops-verify-$GITHUB_RUN_ID" && -d "$STAGED_DEPLOY_DIRECTORY" ]] || fail 'staged directory is unavailable'
          [[ -n "$BACKUP_ENCRYPTION_KEY" && -n "$BACKUP_INTEGRITY_KEY" ]] || fail 'backup key is unavailable'
          development_root=/srv/expressa/development
          state_root="$development_root/state"
          operations_root="$state_root/operations"
          backup_directory="$operations_root/backups"
          metrics_directory="$operations_root/backup-metrics"
          deploy_root="$STAGED_DEPLOY_DIRECTORY"
          [[ -d "$development_root" && -f "$development_root/runtime.env" && ! -L "$development_root/runtime.env" ]] || fail 'development runtime environment is unavailable'
          [[ -d "$state_root" && ! -L "$state_root" && -w "$state_root" ]] || fail 'development state directory is unavailable'
          for path in "$operations_root" "$backup_directory" "$metrics_directory"; do
            [[ ! -e "$path" || ( -d "$path" && ! -L "$path" ) ]] || fail 'operations path is invalid'
          done
          mkdir -p -- "$backup_directory" "$metrics_directory"
          [[ -d "$operations_root" && ! -L "$operations_root" && -d "$backup_directory" && ! -L "$backup_directory" && -d "$metrics_directory" && ! -L "$metrics_directory" ]] || fail 'operations directories are unavailable'
          chmod 700 "$operations_root" "$backup_directory" "$metrics_directory"
          owner_uid="$(id -u)"
          [[ "$(stat -c '%u %a' "$operations_root")" == "$owner_uid 700" ]] || fail 'operations directory permissions are invalid'
          [[ "$(stat -c '%u %a' "$backup_directory")" == "$owner_uid 700" ]] || fail 'backup directory permissions are invalid'
          [[ "$(stat -c '%u %a' "$metrics_directory")" == "$owner_uid 700" ]] || fail 'metric directory permissions are invalid'
          temporary_directory="$(mktemp -d "$deploy_root/.operations-verify.XXXXXX")"
          cleanup() { rm -rf -- "$temporary_directory"; }
          trap cleanup EXIT
          encryption_key_file="$temporary_directory/backup-encryption.key"
          integrity_key_file="$temporary_directory/backup-integrity.key"
          printf '%s' "$BACKUP_ENCRYPTION_KEY" > "$encryption_key_file"
          printf '%s' "$BACKUP_INTEGRITY_KEY" > "$integrity_key_file"
          chmod 600 "$encryption_key_file" "$integrity_key_file"
          [[ -f "$encryption_key_file" && ! -L "$encryption_key_file" && -f "$integrity_key_file" && ! -L "$integrity_key_file" ]] || fail 'temporary backup keys are unavailable'
          [[ "$(stat -c '%u %a' "$encryption_key_file")" == "$owner_uid 600" && "$(stat -c '%u %a' "$integrity_key_file")" == "$owner_uid 600" ]] || fail 'temporary backup key permissions are invalid'
          [[ -x "$deploy_root/backup.sh" && -x "$deploy_root/restore-verify.sh" && -f "$deploy_root/compose.yml" && ! -L "$deploy_root/backup.sh" && ! -L "$deploy_root/restore-verify.sh" && ! -L "$deploy_root/compose.yml" ]] || fail 'development operations scripts are unavailable'
          set -a
          source "$development_root/runtime.env"
          set +a
          [[ "${DELIVERY_VAPID_SUBJECT:-}" ]] || fail 'DELIVERY_VAPID_SUBJECT is required'
          [[ "${DELIVERY_VAPID_PUBLIC_KEY:-}" ]] || fail 'DELIVERY_VAPID_PUBLIC_KEY is required'
          [[ "${DELIVERY_VAPID_PRIVATE_KEY:-}" ]] || fail 'DELIVERY_VAPID_PRIVATE_KEY is required'
          VAPID_SUBJECT="$DELIVERY_VAPID_SUBJECT"
          VAPID_PUBLIC_KEY="$DELIVERY_VAPID_PUBLIC_KEY"
          VAPID_PRIVATE_KEY="$DELIVERY_VAPID_PRIVATE_KEY"
          export VAPID_SUBJECT VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY
          unset DELIVERY_VAPID_SUBJECT DELIVERY_VAPID_PUBLIC_KEY DELIVERY_VAPID_PRIVATE_KEY
          postgres_containers="$(docker ps -q --filter label=com.docker.compose.project=expressa-development --filter label=com.docker.compose.service=postgres)"
          [[ -n "$postgres_containers" && "$(wc -w <<<"$postgres_containers")" == 1 ]] || fail 'development postgres container is unavailable'
          POSTGRES_CONTAINER="$(docker inspect --format '{{.Name}}' "$postgres_containers")"
          POSTGRES_CONTAINER="${POSTGRES_CONTAINER#/}"
          POSTGRES_DB="${POSTGRES_DB:-expressa}"
          POSTGRES_USER="${POSTGRES_USER:-expressa}"
          BACKUP_DIRECTORY="$backup_directory" BACKUP_ENCRYPTION_KEY_FILE="$encryption_key_file" BACKUP_INTEGRITY_KEY_FILE="$integrity_key_file" BACKUP_METRICS_DIRECTORY="$metrics_directory" BACKUP_RETENTION_DAYS=7 POSTGRES_CONTAINER="$POSTGRES_CONTAINER" POSTGRES_DB="$POSTGRES_DB" POSTGRES_USER="$POSTGRES_USER" "$deploy_root/backup.sh" >/dev/null
          shopt -s nullglob
          backups=("$backup_directory"/expressa-*.sql.enc)
          shopt -u nullglob
          (( ${#backups[@]} > 0 )) || fail 'backup artifact is missing'
          newest_backup=''
          for backup in "${backups[@]}"; do
            name="${backup##*/}"
            [[ "$name" =~ ^expressa-[0-9]{8}T[0-9]{6}Z\.sql\.enc$ && -f "$backup" && ! -L "$backup" ]] || fail 'backup artifact is malformed'
            [[ -z "$newest_backup" || "$name" > "${newest_backup##*/}" ]] && newest_backup="$backup"
          done
          [[ -s "$newest_backup.sha256" && ! -L "$newest_backup.sha256" ]] || fail 'backup integrity MAC is missing'
          metric_file="$metrics_directory/expressa_backup.prom"
          [[ -f "$metric_file" && ! -L "$metric_file" ]] || fail 'backup metric is missing'
          grep -qx 'expressa_backup_last_success 1' "$metric_file"
          grep -Eq '^expressa_backup_last_success_timestamp_seconds [1-9][0-9]*$' "$metric_file"
          evidence host_preflight 'environment=development schedule=github-actions'
          evidence source_revision "github_sha=$VERIFIED_MAIN_SHA ref=refs/heads/main"
          evidence backup "artifact=${newest_backup##*/} hmac=passed metric=passed"
          project=expressa-development
          image_for_service() {
            local container
            container="$(docker ps -q --filter "label=com.docker.compose.project=$project" --filter "label=com.docker.compose.service=$1")"
            [[ -n "$container" && "$(wc -w <<<"$container")" == 1 ]] || fail "development $1 container is unavailable"
            docker inspect --format '{{.Config.Image}}' "$container"
          }
          BACKEND_IMAGE="$(image_for_service backend)"
          FRONT_IMAGE="$(image_for_service front)"
          BACK_IMAGE="$(image_for_service back)"
          [[ "$BACKEND_IMAGE" == *@sha256:* && "$FRONT_IMAGE" == *@sha256:* && "$BACK_IMAGE" == *@sha256:* ]] || fail 'development images are not immutable digests'
          export BACKEND_IMAGE FRONT_IMAGE BACK_IMAGE
          if ! restore_output="$({ BACKUP_FILE="$newest_backup" BACKUP_ENCRYPTION_KEY_FILE="$encryption_key_file" BACKUP_INTEGRITY_KEY_FILE="$integrity_key_file" RUNTIME_ENV_FILE="$development_root/runtime.env" COMPOSE_FILE="$deploy_root/compose.yml" "$deploy_root/restore-verify.sh"; } 2>&1)"; then
            printf '%s\n' "$restore_output" >&2
            fail 'isolated restore verification failed'
          fi
          mapfile -t restore_markers < <(grep -E '^expressa-restore-verify: status=passed' <<<"$restore_output" || true)
          (( ${#restore_markers[@]} == 1 )) || fail 'restore evidence is incomplete'
          restore_evidence="${restore_markers[0]}"
          [[ "$restore_evidence" =~ ^expressa-restore-verify:\ status=passed\ rpo_seconds=[0-9]+\ rpo_target_seconds=93600\ rpo_target_passed=true\ rto_seconds=[0-9]+\ rto_target_seconds=900\ rto_target_passed=true$ ]] || fail 'restore evidence is incomplete'
          evidence restore "public_menu=passed ${restore_evidence#expressa-restore-verify: status=passed }"
          alert_directory="$temporary_directory/alert"
          network="expressa-operations-evidence-$RANDOM-$$"
          receiver="expressa-operations-receiver-$RANDOM-$$"
          prometheus="expressa-operations-prometheus-$RANDOM-$$"
          alertmanager="expressa-operations-alertmanager-$RANDOM-$$"
          cleanup_alert_test() {
            docker rm --force "$receiver" "$prometheus" "$alertmanager" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap 'cleanup_alert_test; cleanup' EXIT
          mkdir -p "$alert_directory/evidence"
          chmod 755 "$alert_directory"
          chmod 700 "$alert_directory/evidence"
          cat > "$alert_directory/receiver.mjs" <<'NODE'
          import { createServer } from 'node:http';
          import { appendFileSync } from 'node:fs';
          createServer((request, response) => {
            let body = '';
            request.on('data', (chunk) => { body += chunk; });
            request.on('end', () => {
              try {
                const statuses = JSON.parse(body).alerts.map((alert) => alert.status).sort().join(',');
                appendFileSync('/evidence/alert-statuses.txt', `${statuses}\n`);
                response.writeHead(200).end();
              } catch { response.writeHead(400).end(); }
            });
          }).listen(8080);
          NODE
          cat > "$alert_directory/alertmanager.yml" <<'YAML'
          global:
            resolve_timeout: 5s
          route:
            receiver: evidence
            group_wait: 0s
            group_interval: 1s
            repeat_interval: 1h
          receivers:
            - name: evidence
              webhook_configs:
                - url: http://receiver:8080/alert
          YAML
          cat > "$alert_directory/prometheus.yml" <<'YAML'
          global:
            evaluation_interval: 1s
          rule_files: [/etc/prometheus/rules.yml]
          alerting:
            alertmanagers:
              - static_configs:
                  - targets: [alertmanager:9093]
          YAML
          cat > "$alert_directory/rules.yml" <<'YAML'
          groups:
            - name: operations-evidence
              rules:
                - alert: ExpressaOperationsEvidence
                  expr: vector(1) == 1
          YAML
          chmod 644 "$alert_directory/receiver.mjs" "$alert_directory/alertmanager.yml" "$alert_directory/prometheus.yml" "$alert_directory/rules.yml"
          docker network create "$network" >/dev/null
          docker run --detach --rm --name "$receiver" --user "$(id -u):$(id -g)" --network "$network" --network-alias receiver --mount "type=bind,source=$alert_directory,target=/work,readonly" --mount "type=bind,source=$alert_directory/evidence,target=/evidence" "$BACKEND_IMAGE" /work/receiver.mjs >/dev/null
          docker run --detach --rm --name "$alertmanager" --network "$network" --network-alias alertmanager --mount "type=bind,source=$alert_directory/alertmanager.yml,target=/etc/alertmanager/alertmanager.yml,readonly" prom/alertmanager@sha256:d5155cfac40a6d9250ffc97c19db2c5e190c7bc57c6b67125c94903358f8c7d8 --config.file=/etc/alertmanager/alertmanager.yml >/dev/null
          docker run --detach --rm --name "$prometheus" --network "$network" --mount "type=bind,source=$alert_directory/prometheus.yml,target=/etc/prometheus/prometheus.yml,readonly" --mount "type=bind,source=$alert_directory/rules.yml,target=/etc/prometheus/rules.yml" prom/prometheus@sha256:6927e0919a144aa7616fd0137d4816816d42f6b816de3af269ab065250859a62 --config.file=/etc/prometheus/prometheus.yml --web.enable-lifecycle >/dev/null
          for container in "$receiver" "$alertmanager" "$prometheus"; do
            [[ "$(docker inspect --format '{{.State.Running}}' "$container")" == true ]] || fail "alert test container is unavailable: $container"
          done
          for _ in {1..15}; do
            if [[ "$(docker inspect --format '{{.State.Running}}' "$receiver")" == true ]] && docker exec "$receiver" /nodejs/bin/node -e "fetch('http://127.0.0.1:8080').then(() => process.exit(0)).catch(() => process.exit(1))"; then
              break
            fi
            sleep 1
          done
          [[ "$(docker inspect --format '{{.State.Running}}' "$receiver")" == true ]] || fail 'alert receiver is unavailable'
          docker exec "$receiver" /nodejs/bin/node -e "fetch('http://127.0.0.1:8080').then(() => process.exit(0)).catch(() => process.exit(1))" || fail 'alert receiver HTTP is unavailable'
          alert_diagnostics() {
            for container in "$receiver" "$alertmanager" "$prometheus"; do
              printf 'expressa-operations-diagnostic: container=%s\n' "$container" >&2
              docker inspect --format 'status={{.State.Status}} exit_code={{.State.ExitCode}} error={{.State.Error}}' "$container" >&2 || true
              docker logs --tail 100 "$container" >&2 || true
            done
          }
          for _ in {1..45}; do grep -qsx firing "$alert_directory/evidence/alert-statuses.txt" && break; sleep 1; done
          grep -qsx firing "$alert_directory/evidence/alert-statuses.txt" || { alert_diagnostics; fail 'alert firing delivery unavailable'; }
          sed -i 's/vector(1) == 1/vector(0) == 1/' "$alert_directory/rules.yml"
          docker exec "$prometheus" wget -qO- --post-data='' http://127.0.0.1:9090/-/reload >/dev/null
          for _ in {1..45}; do grep -qsx resolved "$alert_directory/evidence/alert-statuses.txt" && break; sleep 1; done
          grep -qsx resolved "$alert_directory/evidence/alert-statuses.txt" || { alert_diagnostics; fail 'alert resolved delivery unavailable'; }
          evidence alert_delivery 'source=prometheus receiver=acknowledged resolved=acknowledged'
          REMOTE
          chmod 700 "$temporary_directory/verify-operations.sh"
          scp -P "$DEPLOY_PORT" -i "$temporary_directory/key" -o UserKnownHostsFile="$temporary_directory/known_hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes deploy/backup.sh deploy/restore-verify.sh deploy/compose.yml "$temporary_directory/verify-operations.sh" "$DEPLOY_USER@$DEPLOY_HOST:$remote_directory/"
          printf '%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s\0' "$BACKUP_ENCRYPTION_KEY" "$BACKUP_INTEGRITY_KEY" "$VAPID_SUBJECT" "$VAPID_PUBLIC_KEY" "$VAPID_PRIVATE_KEY" "$VERIFIED_MAIN_SHA" "$remote_directory" "$GITHUB_RUN_ID" | ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "set -Eeuo pipefail; IFS= read -r -d '' BACKUP_ENCRYPTION_KEY; IFS= read -r -d '' BACKUP_INTEGRITY_KEY; IFS= read -r -d '' DELIVERY_VAPID_SUBJECT; IFS= read -r -d '' DELIVERY_VAPID_PUBLIC_KEY; IFS= read -r -d '' DELIVERY_VAPID_PRIVATE_KEY; IFS= read -r -d '' VERIFIED_MAIN_SHA; IFS= read -r -d '' STAGED_DEPLOY_DIRECTORY; IFS= read -r -d '' GITHUB_RUN_ID; export BACKUP_ENCRYPTION_KEY BACKUP_INTEGRITY_KEY DELIVERY_VAPID_SUBJECT DELIVERY_VAPID_PUBLIC_KEY DELIVERY_VAPID_PRIVATE_KEY VERIFIED_MAIN_SHA STAGED_DEPLOY_DIRECTORY GITHUB_RUN_ID; bash $(printf %q "$remote_directory/verify-operations.sh")" > "$evidence_file"
          grep -Eq '^expressa-operations-evidence: check=host_preflight status=passed environment=development schedule=github-actions$' "$evidence_file"
          grep -Eq '^expressa-operations-evidence: check=source_revision status=passed github_sha=[a-f0-9]{40} ref=refs/heads/main$' "$evidence_file"
          grep -Eq '^expressa-operations-evidence: check=backup status=passed artifact=expressa-[0-9]{8}T[0-9]{6}Z\.sql\.enc hmac=passed metric=passed$' "$evidence_file"
          grep -Eq '^expressa-operations-evidence: check=restore status=passed public_menu=passed rpo_seconds=[0-9]+ rpo_target_seconds=93600 rpo_target_passed=true rto_seconds=[0-9]+ rto_target_seconds=900 rto_target_passed=true$' "$evidence_file"
          grep -Eq '^expressa-operations-evidence: check=alert_delivery status=passed source=prometheus receiver=acknowledged resolved=acknowledged$' "$evidence_file"
      - name: Upload sanitized operations evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-operations-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/operations-evidence.txt
          if-no-files-found: error
          retention-days: 30
