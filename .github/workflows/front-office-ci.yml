name: Front-office CI

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - "front-office/**"
      - "backend/**"
      - ".github/workflows/front-office-ci.yml"

permissions:
  contents: read

concurrency:
  group: front-office-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build front-office image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-office
    env:
      VITE_APP_ENV: local
      VITE_API_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        # actions/checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Validate Docker image build
        run: >-
          docker build
          --build-arg VITE_APP_ENV="$VITE_APP_ENV"
          --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL"
          --tag expressa-front-office:ci
          .
