name: Front-office CI

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'front-office/**'
      - 'backend/openapi/openapi.json'
      - '.github/workflows/front-office-ci.yml'

permissions:
  contents: read

concurrency:
  group: front-office-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify front-office
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-office
    env:
      VITE_APP_ENV: development
      VITE_API_BASE_URL: https://api.development.example
    steps:
      - name: Checkout
        # actions/checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        # actions/setup-node v5.0.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: front-office/.nvmrc
          cache: npm
          cache-dependency-path: front-office/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright 1.62.1
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --run

      - name: Verify OpenAPI contract
        run: npm run contract:check

      - name: Build Storybook
        run: npm run storybook:build

      - name: Upload Storybook preview
        # actions/upload-artifact v4.6.0
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: front-office-storybook
          path: /tmp/expressa-front-office-storybook

      - name: Accessibility tests
        run: npm run test:a11y

      - name: Visual regression tests
        run: npm run test:visual

      - name: Upload visual baselines
        # actions/upload-artifact v4.6.0
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: front-office-visual-baselines
          path: front-office/scripts/__screenshots__/visual.spec.mjs

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high

      - name: Validate Docker image build
        run: >-
          docker build
          --build-arg VITE_APP_ENV="$VITE_APP_ENV"
          --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL"
          --tag expressa-front-office:ci
          .
