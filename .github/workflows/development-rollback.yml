name: Development rollback

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to roll back to the previous development digest
        required: true
        type: choice
        options:
          - backend
          - front
          - back

permissions: {}

concurrency:
  group: development-deployment
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back development component
    runs-on: ubuntu-24.04
    environment: development
    env:
      ROLLBACK_COMPONENT: ${{ inputs.component }}
      DEPLOY_HOST: ${{ secrets.EXPRESSA_VPS_HOST }}
      DEPLOY_USER: ${{ secrets.EXPRESSA_VPS_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.EXPRESSA_VPS_PORT }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.EXPRESSA_VPS_DEPLOY_SSH_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.EXPRESSA_VPS_KNOWN_HOSTS }}
    steps:
      - name: Roll back immutable development component by SSH
        shell: bash
        run: |
          set -Eeuo pipefail

          temporary_directory="$(mktemp -d)"
          cleanup() {
            unset DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS
            rm -rf "$temporary_directory"
          }
          trap cleanup EXIT HUP INT TERM

          [[ "$ROLLBACK_COMPONENT" =~ ^(backend|front|back)$ ]] || {
            printf '%s\n' 'rollback component is invalid' >&2
            exit 1
          }
          if (( ${#DEPLOY_HOST} > 253 )); then
            printf '%s\n' 'deployment DNS host must not exceed 253 characters' >&2
            exit 1
          elif [[ "$DEPLOY_HOST" =~ ^([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)*[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$ ]]; then
            :
          elif node -e "process.exit(require('node:net').isIP(process.env.DEPLOY_HOST) ? 0 : 1)"; then
            :
          else
            printf '%s\n' 'deployment host must be a single DNS name, IPv4 address, or IPv6 address' >&2
            exit 1
          fi
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || {
            printf '%s\n' 'deployment user must be a POSIX username' >&2
            exit 1
          }
          if ! [[ "$DEPLOY_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || ! (( 10#$DEPLOY_PORT <= 65535 )); then
            printf '%s\n' 'deployment port must be between 1 and 65535' >&2
            exit 1
          fi
          [[ -n "$DEPLOY_SSH_PRIVATE_KEY" && -n "$DEPLOY_SSH_KNOWN_HOSTS" ]] || {
            printf '%s\n' 'deployment SSH credentials are required' >&2
            exit 1
          }

          private_key="$temporary_directory/id_ed25519"
          known_hosts="$temporary_directory/known_hosts"
          ssh_config="$temporary_directory/config"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$private_key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$known_hosts"
          {
            printf '%s\n' 'Host delivery-target'
            printf '  HostName %s\n' "$DEPLOY_HOST"
            printf '  User %s\n' "$DEPLOY_USER"
            printf '  Port %s\n' "$DEPLOY_PORT"
            printf '  IdentityFile %s\n' "$private_key"
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  BatchMode yes'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '%s\n' '  PasswordAuthentication no'
            printf '%s\n' '  KbdInteractiveAuthentication no'
            printf '%s\n' '  PreferredAuthentications publickey'
            printf '%s\n' '  ForwardAgent no'
            printf '%s\n' '  PermitLocalCommand no'
            printf '%s\n' '  RequestTTY no'
            printf '  UserKnownHostsFile %s\n' "$known_hosts"
          } > "$ssh_config"
          chmod 600 "$private_key" "$known_hosts" "$ssh_config"

          remote_stdout="$temporary_directory/ssh.stdout"
          remote_stderr="$temporary_directory/ssh.stderr"
          # shellcheck disable=SC2016
          remote_command='
            set -Eeuo pipefail
            report_failure() {
              printf "expressa-deploy: preflight code=%s\n" "$1" >&2
              exit 1
            }

            source /dev/stdin
            [[ "${DEPLOY_ROOT:-}" == /srv/expressa && "${DEPLOY_ENV:-}" == development ]] || report_failure input
            [[ "${ROLLBACK_COMPONENT:-}" =~ ^(backend|front|back)$ ]] || report_failure component
            [[ -d /srv/expressa/infra && ! -L /srv/expressa/infra ]] || report_failure path
            [[ -x /srv/expressa/infra/deploy/deploy.sh && ! -L /srv/expressa/infra/deploy/deploy.sh ]] || report_failure script
            [[ -r /srv/expressa/development/state/current && -r /srv/expressa/development/state/previous ]] || report_failure state
            command -v docker >/dev/null && docker compose version >/dev/null 2>&1 || report_failure docker
            cd -- /srv/expressa/infra
            exec ./deploy/deploy.sh --environment development rollback "$ROLLBACK_COMPONENT"
          '
          emit_remote_diagnostics() {
            local line marker_pattern preflight_pattern
            marker_pattern='^expressa-deploy: phase=(preflight|pull|backup|migrate|compose|smoke|state) status=(start|failed|complete)$'
            preflight_pattern='^expressa-deploy: preflight code=(input|component|path|script|state|docker)$'
            while IFS= read -r line; do
              if [[ "$line" =~ $marker_pattern || "$line" =~ $preflight_pattern ]]; then
                printf '%s\n' "$line" >&2
              fi
            done < <(cat "$remote_stdout" "$remote_stderr")
          }

          {
            printf '%s\n' 'export DEPLOY_ROOT=/srv/expressa'
            printf '%s\n' 'export DEPLOY_ENV=development'
            printf 'export ROLLBACK_COMPONENT=%q\n' "$ROLLBACK_COMPONENT"
          } | ssh -F "$ssh_config" -T delivery-target "$remote_command" > "$remote_stdout" 2> "$remote_stderr" || {
            emit_remote_diagnostics
            printf '%s\n' 'remote development rollback failed' >&2
            exit 1
          }
