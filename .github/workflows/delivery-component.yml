name: Delivery component

on:
  workflow_call:
    inputs:
      component:
        description: Component name.
        required: true
        type: string
      context:
        description: Docker build context.
        required: true
        type: string
      image:
        description: Fixed component image name.
        required: true
        type: string
      deployment_environment:
        description: GitHub environment that provides private-registry credentials.
        required: true
        type: string
    secrets:
      EXPRESSA_VPS_HOST:
        required: true
      EXPRESSA_VPS_PORT:
        required: true
      EXPRESSA_VPS_DEPLOY_USER:
        required: true
      EXPRESSA_VPS_DEPLOY_SSH_KEY:
        required: true
      EXPRESSA_VPS_KNOWN_HOSTS:
        required: true
    outputs:
      image_reference_base64:
        description: Base64-encoded immutable private-registry image reference.
        value: ${{ jobs.build.outputs.image_reference_base64 }}

permissions:
  contents: read

concurrency:
  group: delivery-component-${{ inputs.component }}
  cancel-in-progress: false

jobs:
  build:
    name: Build or release image
    if: inputs.deployment_environment == 'development'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.deployment_environment }}
    outputs:
      image_reference_base64: ${{ steps.image.outputs.image_reference_base64 }}
    steps:
      - name: Checkout
        # actions/checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Build main image or alias release digest through private registry tunnel
        id: image
        env:
          COMPONENT: ${{ inputs.component }}
          CONTEXT: ${{ inputs.context }}
          IMAGE: ${{ inputs.image }}
          DEPLOY_HOST: ${{ secrets.EXPRESSA_VPS_HOST }}
          DEPLOY_PORT: ${{ secrets.EXPRESSA_VPS_PORT }}
          DEPLOY_USER: ${{ secrets.EXPRESSA_VPS_DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.EXPRESSA_VPS_DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.EXPRESSA_VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail

          case "$COMPONENT:$CONTEXT:$IMAGE" in
            backend:backend:expressa-backend)
              registry_package=backend
              ;;
            front-office:front-office:expressa-front-office)
              registry_package=front-office
              ;;
            back-office:back-office:expressa-back-office)
              registry_package=back-office
              ;;
            *)
              printf '%s\n' 'component, context, and image are not an allowed combination' >&2
              exit 1
              ;;
          esac
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]] || {
            printf '%s\n' 'GitHub SHA must be a 40-character lowercase hexadecimal commit ID' >&2
            exit 1
          }
          if (( ${#DEPLOY_HOST} > 253 )); then
            printf '%s\n' 'deployment DNS host must not exceed 253 characters' >&2
            exit 1
          elif [[ "$DEPLOY_HOST" =~ ^([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)*[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$ ]]; then
            :
          elif node -e "process.exit(require('node:net').isIP(process.env.DEPLOY_HOST) ? 0 : 1)"; then
            :
          else
            printf '%s\n' 'deployment host must be a single DNS name, IPv4 address, or IPv6 address' >&2
            exit 1
          fi
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || {
            printf '%s\n' 'deployment user must be a POSIX username' >&2
            exit 1
          }
          if ! [[ "$DEPLOY_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || ! (( 10#$DEPLOY_PORT <= 65535 )); then
            printf '%s\n' 'deployment port must be between 1 and 65535' >&2
            exit 1
          fi
          [[ -n "$DEPLOY_SSH_PRIVATE_KEY" && -n "$DEPLOY_SSH_KNOWN_HOSTS" ]] || {
            printf '%s\n' 'deployment SSH credentials are required' >&2
            exit 1
          }

          temporary_directory="$(mktemp -d)"
          tunnel_pid=''
          # shellcheck disable=SC2329
          cleanup() {
            if [[ -n "$tunnel_pid" ]] && kill -0 "$tunnel_pid" 2>/dev/null; then
              kill "$tunnel_pid" 2>/dev/null || true
              wait "$tunnel_pid" 2>/dev/null || true
            fi
            unset DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS
            rm -rf "$temporary_directory"
          }
          trap cleanup EXIT HUP INT TERM

          private_key="$temporary_directory/id_ed25519"
          known_hosts="$temporary_directory/known_hosts"
          ssh_config="$temporary_directory/config"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$private_key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$known_hosts"
          ssh-keygen -l -f "$known_hosts" >/dev/null
          {
            printf '%s\n' 'Host private-registry'
            printf '  HostName %s\n' "$DEPLOY_HOST"
            printf '  User %s\n' "$DEPLOY_USER"
            printf '  Port %s\n' "$DEPLOY_PORT"
            printf '  IdentityFile %s\n' "$private_key"
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  BatchMode yes'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '%s\n' '  PasswordAuthentication no'
            printf '%s\n' '  KbdInteractiveAuthentication no'
            printf '%s\n' '  PreferredAuthentications publickey'
            printf '%s\n' '  ForwardAgent no'
            printf '%s\n' '  PermitLocalCommand no'
            printf '%s\n' '  RequestTTY no'
            printf '%s\n' '  ExitOnForwardFailure yes'
            printf '  UserKnownHostsFile %s\n' "$known_hosts"
          } > "$ssh_config"
          chmod 600 "$private_key" "$known_hosts" "$ssh_config"

          ssh -F "$ssh_config" -T private-registry \
            'curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5000/v2/' >/dev/null

          registry_port="$(node -e "const net = require('node:net'); const server = net.createServer(); server.listen(0, '127.0.0.1', () => { const { port } = server.address(); server.close(() => process.stdout.write(String(port))); });")"
          [[ "$registry_port" =~ ^[1-9][0-9]{0,4}$ ]] || {
            printf '%s\n' 'cannot allocate a loopback registry tunnel port' >&2
            exit 1
          }
          printf '  LocalForward 127.0.0.1:%s 127.0.0.1:5000\n' "$registry_port" >> "$ssh_config"
          ssh -F "$ssh_config" -N private-registry &
          tunnel_pid=$!
          for attempt in {1..30}; do
            if ! kill -0 "$tunnel_pid" 2>/dev/null; then
              wait "$tunnel_pid"
              printf '%s\n' 'private registry SSH tunnel exited before becoming ready' >&2
              exit 1
            fi
            if curl --fail --silent --show-error --max-time 2 "http://127.0.0.1:$registry_port/v2/" >/dev/null; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              printf '%s\n' 'private registry SSH tunnel did not become ready' >&2
              exit 1
            fi
            sleep 1
          done

          image_repository="127.0.0.1:$registry_port/expressa/$registry_package"
          remote_repository="127.0.0.1:5000/expressa/$registry_package"
          package_version="$(node -p "require('./$CONTEXT/package.json').version")"
          [[ "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            printf '%s\n' 'package.json version must match X.Y.Z' >&2
            exit 1
          }

          manifest_headers="$temporary_directory/manifest.headers"
          manifest_body="$temporary_directory/manifest.json"
          registry_manifest() {
            local repository="$1"
            local reference="$2"
            local status
            status="$(curl --silent --show-error --max-time 15 \
              --dump-header "$manifest_headers" \
              --output "$manifest_body" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "http://127.0.0.1:$registry_port/v2/$repository/manifests/$reference")"
            case "$status" in
              200) return 0 ;;
              404) return 1 ;;
              *)
                printf 'registry returned HTTP %s for manifest lookup\n' "$status" >&2
                return 2
                ;;
            esac
          }
          manifest_digest() {
            tr -d '\r' < "$manifest_headers" | awk -F ': ' 'tolower($1) == "docker-content-digest" { print $2 }'
          }
          manifest_content_type() {
            tr -d '\r' < "$manifest_headers" | awk -F ': ' 'tolower($1) == "content-type" { sub(/;.*/, "", $2); print $2 }'
          }
          require_digest() {
            [[ "$1" =~ ^sha256:[a-f0-9]{64}$ ]] || {
              printf '%s\n' 'registry did not return a canonical sha256 manifest digest' >&2
              exit 1
            }
          }
          require_manifest_content_type() {
            case "$1" in
              application/vnd.oci.image.index.v1+json|application/vnd.oci.image.manifest.v1+json|application/vnd.docker.distribution.manifest.v2+json)
                ;;
              *)
                printf '%s\n' 'registry did not return an allowed manifest content type' >&2
                return 1
                ;;
            esac
          }
          validate_canonical_manifest() {
            local repository="$1"
            local digest="$2"
            local canonical_digest
            local canonical_content_type
            registry_manifest "$repository" "$digest" || {
              printf '%s\n' 'private registry did not expose canonical manifest digest' >&2
              return 1
            }
            canonical_digest="$(manifest_digest)"
            canonical_content_type="$(manifest_content_type)"
            require_digest "$canonical_digest"
            [[ "$canonical_digest" == "$digest" ]] || {
              printf '%s\n' 'private registry canonical manifest digest does not match requested digest' >&2
              return 1
            }
            require_manifest_content_type "$canonical_content_type"
          }
          run_canonical_manifest_adversarial_checks() (
            local repository='expressa/check'
            local tag='sha-test-tag'
            local expected_digest='sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
            local tag_digest
            local adversarial_case
            manifest_headers="$temporary_directory/adversarial.headers"
            registry_manifest() {
              local reference="$2"
              if [[ "$reference" == "$tag" ]]; then
                printf 'Docker-Content-Digest: %s\nContent-Type: application/vnd.oci.image.manifest.v1+json\n' "$expected_digest" > "$manifest_headers"
                return 0
              fi
              case "$adversarial_case" in
                canonical-http-500)
                  return 2
                  ;;
                canonical-digest-mismatch)
                  printf '%s\n' 'Docker-Content-Digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' > "$manifest_headers"
                  printf '%s\n' 'Content-Type: application/vnd.oci.image.manifest.v1+json' >> "$manifest_headers"
                  return 0
                  ;;
                canonical-content-type-invalid)
                  printf 'Docker-Content-Digest: %s\nContent-Type: text/plain\n' "$expected_digest" > "$manifest_headers"
                  return 0
                  ;;
              esac
            }
            for adversarial_case in canonical-http-500 canonical-digest-mismatch canonical-content-type-invalid; do
              registry_manifest "$repository" "$tag"
              tag_digest="$(manifest_digest)"
              require_digest "$tag_digest"
              if validate_canonical_manifest "$repository" "$tag_digest" >/dev/null 2>&1; then
                printf 'canonical manifest validation accepted %s\n' "$adversarial_case" >&2
                exit 1
              fi
            done
          )
          run_canonical_manifest_adversarial_checks

          sha_tag="sha-$GITHUB_SHA"
          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            if registry_manifest "expressa/$registry_package" "$sha_tag"; then
              digest="$(manifest_digest)"
              require_digest "$digest"
              validate_canonical_manifest "expressa/$registry_package" "$digest"
            else
              manifest_status=$?
              [[ "$manifest_status" == 1 ]] || exit "$manifest_status"
              created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              build_arguments=()
              case "$COMPONENT" in
                front-office|back-office)
                  build_arguments+=(--build-arg VITE_APP_ENV=development --build-arg VITE_API_BASE_URL=/)
                  ;;
              esac
              docker buildx build \
                --metadata-file "$temporary_directory/metadata.json" \
                --output "type=image,name=$image_repository:$sha_tag,push=true,registry.insecure=true" \
                --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
                --label "org.opencontainers.image.revision=$GITHUB_SHA" \
                --label "org.opencontainers.image.created=$created" \
                --label "org.opencontainers.image.version=$package_version" \
                ${build_arguments[@]+"${build_arguments[@]}"} \
                "$CONTEXT"
              built_digest="$(node -e "const metadata = require(process.argv[1]); const digest = metadata['containerimage.digest']; if (!/^sha256:[a-f0-9]{64}$/.test(digest || '')) process.exit(1); process.stdout.write(digest)" "$temporary_directory/metadata.json")"
              require_digest "$built_digest"
              registry_manifest "expressa/$registry_package" "$sha_tag" || {
                printf '%s\n' 'private registry did not expose published SHA image' >&2
                exit 1
              }
              digest="$(manifest_digest)"
              require_digest "$digest"
              [[ "$digest" == "$built_digest" ]] || {
                printf '%s\n' 'private registry SHA tag does not resolve to built digest' >&2
                exit 1
              }
              validate_canonical_manifest "expressa/$registry_package" "$digest"
            fi
          elif [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            tag="$GITHUB_REF_NAME"
            tag_prefix="$COMPONENT-v"
            [[ "$tag" == "$tag_prefix"* ]] || {
              printf '%s\n' 'release tag component does not match delivery component' >&2
              exit 1
            }
            normalized_tag="v${tag#"$tag_prefix"}"
            [[ "$normalized_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
              printf '%s\n' 'release tag must match component-vX.Y.Z' >&2
              exit 1
            }
            version="${normalized_tag#v}"
            [[ "$package_version" == "$version" ]] || {
              printf '%s\n' 'package.json version does not match Git tag' >&2
              exit 1
            }
            [[ -f CHANGELOG.md ]] || {
              printf '%s\n' 'root CHANGELOG.md is required for a release' >&2
              exit 1
            }
            grep -Eq "^##[[:space:]]+\\[?${COMPONENT}[[:space:]]+v?${version}\\]?([[:space:]]|$| - )" CHANGELOG.md || {
              printf '%s\n' 'CHANGELOG.md does not contain the component release version' >&2
              exit 1
            }
            if registry_manifest "expressa/$registry_package" "$normalized_tag"; then
              printf '%s\n' 'release image tag already exists' >&2
              exit 1
            else
              manifest_status=$?
              [[ "$manifest_status" == 1 ]] || exit "$manifest_status"
            fi
            registry_manifest "expressa/$registry_package" "$sha_tag" || {
              printf '%s\n' 'published SHA image is required before creating a release alias' >&2
              exit 1
            }
            source_digest="$(manifest_digest)"
            require_digest "$source_digest"
            validate_canonical_manifest "expressa/$registry_package" "$source_digest"
            source_content_type="$(manifest_content_type)"
            curl --fail --silent --show-error --max-time 30 \
              --request PUT \
              --header "Content-Type: $source_content_type" \
              --data-binary "@$manifest_body" \
              "http://127.0.0.1:$registry_port/v2/expressa/$registry_package/manifests/$normalized_tag" >/dev/null
            registry_manifest "expressa/$registry_package" "$normalized_tag" || {
              printf '%s\n' 'private registry did not expose release alias' >&2
              exit 1
            }
            digest="$(manifest_digest)"
            require_digest "$digest"
            [[ "$digest" == "$source_digest" ]] || {
              printf '%s\n' 'release image tag does not resolve to the source digest' >&2
              exit 1
            }
            validate_canonical_manifest "expressa/$registry_package" "$digest"
          else
            printf '%s\n' 'delivery workflow accepts only main commits and version tags' >&2
            exit 1
          fi

          image_reference="$remote_repository@$digest"
          printf 'image_reference_base64=%s\n' "$(printf '%s' "$image_reference" | base64 --wrap=0)" >> "$GITHUB_OUTPUT"
