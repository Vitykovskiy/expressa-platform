services:
  prometheus:
    image: "prom/prometheus@sha256:6927e0919a144aa7616fd0137d4816816d42f6b816de3af269ab065250859a62"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [operations, edge]
    restart: unless-stopped

  grafana:
    image: "grafana/grafana@sha256:8b37a2f028f164ce7b9889e1765b9d6ee23fec80f871d156fbf436d6198d32b7"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [operations]
    restart: unless-stopped

  alertmanager:
    image: "prom/alertmanager@sha256:d5155cfac40a6d9250ffc97c19db2c5e190c7bc57c6b67125c94903358f8c7d8"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - type: bind
        source: "${ALERTMANAGER_CONFIG_FILE:?ALERTMANAGER_CONFIG_FILE is required}"
        target: /etc/alertmanager/alertmanager.yml
        read_only: true
        bind:
          create_host_path: false
    networks: [operations]
    restart: unless-stopped

  node-exporter:
    image: "prom/node-exporter@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706"
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
    volumes:
      - /:/host:ro,rslave
      - "${BACKUP_METRICS_DIRECTORY:?BACKUP_METRICS_DIRECTORY is required}:/var/lib/node_exporter/textfile_collector:ro"
    networks: [operations]
    restart: unless-stopped

networks:
  edge:
    name: "expressa-${DEPLOY_ENV:?DEPLOY_ENV is required}-edge"
    external: true
  operations:

volumes:
  grafana-data:
  prometheus-data:
